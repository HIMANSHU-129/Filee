# Filee Default Application Configuration
app.name=Filee
app.version=0.1.0-alpha
app.theme=dark

# Conversion defaults
conversion.overwrite_existing=false
conversion.output_mode=same_folder
conversion.max_concurrent_jobs=2

# Python Engine Defaults
python.enable_venv=true
python.ping_interval_ms=5000

# History
history.enabled=true
history.max_entries=100
